<!doctype html>
{{- $scheme := site.Params.colorScheme | default "auto" }}
<html lang="{{ site.Language.Locale | default site.Language.Lang }}" class="no-js"
  {{- if in (slice "light" "dark") $scheme }} data-theme="{{ $scheme }}"{{ end }}>
<head>
  {{- partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}">
  <a class="skip-link" href="#main">{{ T "skip_to_content" }}</a>
  {{- partial "header.html" . }}
  <main id="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- partial "scripts.html" . }}
</body>
</html>
