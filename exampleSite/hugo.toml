# Run from the repository root:
#   hugo server -s exampleSite
# exampleSite/themes/hugo-gridline is a symlink to the repository root, so this
# works whatever the cloned folder is called.
baseURL = "https://example.org/"
theme = "hugo-gridline"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 40

[pagination]
  pagerSize = 20

# Pull the theme's markup (code highlighting classes, CJK line breaks, figures)
# and related-content settings into this site.
[markup]
  _merge = "deep"
[related]
  _merge = "deep"

[taxonomies]
  category = "categories"
  tag = "tags"
  author = "authors"

# Category and author archives live under /blog/, like the posts.
[permalinks]
  [permalinks.page]
    blog = "/blog/:contentbasename/"
  [permalinks.term]
    categories = "/blog/tagged/:contentbasename/"
    authors = "/blog/authors/:contentbasename/"
  [permalinks.taxonomy]
    categories = "/blog/tagged/"
    authors = "/blog/authors/"

[params]
  mainSections = ["blog"]
  monogram = "O"
  colorScheme = "auto"
  featuredCount = 3
  # "latest" (default): newest posts on top. "featured": posts with `featured: true` first.
  featuredRow = "latest"
  # Load the sliced web fonts (see the theme's hugo.toml).
  webFonts = true

# ───────────── English ─────────────
[languages.en]
  locale = "en-US"
  label = "EN"
  title = "Orbitline Blog"
  contentDir = "content/en"
  weight = 1
  copyright = "© 2026 Orbitline demo team · Sample content is fictional"

  [languages.en.params]
    description = "Engineering notes, product updates and tips from the Orbitline team."
    # Social preview for pages without their own raster `images` / `cover` (the source is assets/og/og.svg).
    images = ["og.png"]
    [languages.en.params.hero]
      title = "From the Blog"
      subtitle = "Engineering notes, product updates and tips from the team."
    [languages.en.params.headerButton]
      label = "Subscribe"
      url = "/index.xml"
    [languages.en.params.cta]
      eyebrow = "Stay in the loop"
      title = "Every new post, straight to your reader"
      text = "Subscribe with RSS, or tell us what you would like to read next."
      [[languages.en.params.cta.buttons]]
        label = "Subscribe via RSS"
        url = "/index.xml"
        primary = true
      [[languages.en.params.cta.buttons]]
        label = "About us"
        url = "/about/"

  [[languages.en.menus.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 10
  [[languages.en.menus.main]]
    name = "Categories"
    pageRef = "/categories"
    weight = 20
  [[languages.en.menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 30

  [[languages.en.menus.footer]]
    name = "Blog"
    identifier = "blog"
    weight = 10
  [[languages.en.menus.footer]]
    name = "All posts"
    pageRef = "/blog"
    parent = "blog"
    weight = 1
  [[languages.en.menus.footer]]
    name = "Categories"
    pageRef = "/categories"
    parent = "blog"
    weight = 2
  [[languages.en.menus.footer]]
    name = "Authors"
    pageRef = "/authors"
    parent = "blog"
    weight = 3
  [[languages.en.menus.footer]]
    name = "Project"
    identifier = "project"
    weight = 20
  [[languages.en.menus.footer]]
    name = "About"
    pageRef = "/about"
    parent = "project"
    weight = 1
  [[languages.en.menus.footer]]
    name = "Hugo"
    url = "https://gohugo.io"
    parent = "project"
    weight = 2

