  <text x="200" y="208" text-anchor="middle" fill="#315cf4" font-family="Lilex, &quot;IBM Plex Mono&quot;, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="500">O</text>
